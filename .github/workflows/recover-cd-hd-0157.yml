name: One-time recover CD-0157 HD-0157

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-cd-hd-0157.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Requeue failed rows with canonical tool
        run: |
          set -e
          python3 scripts/requeue_rows.py --ids CD-0157,HD-0157
          python3 scripts/validate_content_matrix.py
          git diff -- data/content-matrix.csv
      - name: Commit repaired matrix
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/content-matrix.csv
          git diff --cached --quiet && { echo "No matrix changes"; exit 0; }
          git commit -m "factory: requeue CD-0157, HD-0157 FAIL -> REPAIR (repair:1)"
          git push origin HEAD:main
