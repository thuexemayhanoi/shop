name: Diagnose Jekyll build (v2)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose-jekyll.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with official Pages action
        id: pages_build
        continue-on-error: true
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Record outcome
        run: |
          echo "pages_build outcome: ${{ steps.pages_build.outcome }}" | tee -a jekyll-build.log

      - name: Run Pages builder container with full log
        continue-on-error: true
        run: |
          set +e
          docker pull ghcr.io/actions/jekyll-build-pages:v1.0.13
          docker run --rm \
            -e INPUT_SOURCE=./ \
            -e INPUT_DESTINATION=./_site_c \
            -e INPUT_VERBOSE=true \
            -e GITHUB_WORKSPACE=/github/workspace \
            -e GITHUB_REPOSITORY=thuexemayhanoi/shop \
            -e INPUT_BUILD_REVISION=${{ github.sha }} \
            -v "$PWD:/github/workspace" \
            -w /github/workspace \
            ghcr.io/actions/jekyll-build-pages:v1.0.13 >> jekyll-build.log 2>&1
          echo "docker exit=$?" | tee -a jekyll-build.log
          exit 0

      - name: Push log to diagnose branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B diagnose
          git add jekyll-build.log
          git commit -m "diagnose: jekyll build log" --no-verify || echo "nothing to commit"
          git push origin diagnose --force
