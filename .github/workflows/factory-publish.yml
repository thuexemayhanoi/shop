name: Factory Publish (micro-pair)

# EVENT-DRIVEN PUBLISH PIPELINE (Simple Production Mode). NO AI, NO API
# keys, NO secrets, NO cron. Ported from the vanchinh design and adapted
# to the /shop deploy-gate drafts model.
#
# The external WRITER commits article files (drafts live under
# _drafts/cam-nang/**; published articles at cam-nang/**); this workflow
# derives the EXACT scope from the files added/modified in the push
# (scripts/factory_push_selection.py) and runs the canonical factory
# tooling for that scope ONLY:
#
#   NEW article push:     claim exactly the added-article IDs (max 50;
#                         the production micro-loop pushes 2 per pair)
#                          -> scoped QA -> transactional publish of PASS
#   REPAIR article push:  scoped QA + publish EXACTLY the repaired
#                         active IDs; touched PASS IDs publish directly;
#                         NEVER claims fresh PLANNED rows
#   BACKLOG:              PLANNED rows whose files already exist (<= 50,
#                         deterministic article_id order) - recovery for
#                         a pipeline failure between file add and claim
#   SKIP:                 tooling-only push / the factory's own state
#                         commit re-triggering on promoted PUBLISHED
#                         files -> nothing to do, workflow exits green
#                         and BOUNDED (no recursion: a state commit
#                         never produces new article work)
#   workflow_dispatch:    publish exactly the explicit PASS ids given in
#                         publish_ids (canonical transaction, full gates)
#
# Publish gate: score >= config/article-rubric.json thresholds.PASS.min
# (owner-approved 75/70/75 - QUALITY_MIN = PUBLISH_MIN = 75, SEO floor
# = REVIEW.min = 70; critical gates are NEVER lowered). Single commit of
# derived state per run. Full test suites + full-site audits are NOT
# part of the per-pair loop: they run in article-quality CI on every
# push and in the batch-end FULL audit below.
#
# Four-layer reliability hardening is preserved: fail-closed pending-txn
# recovery, atomic batch lock, exact-ID verification, semantic verifier
# (scripts/verify_factory_state.py), kill switch (config/content-factory
# .json), Hanoi (+07:00) timestamps, schema-2 reports.
# See docs/FACTORY-PUBLISH-WORKFLOW.md.

on:
  push:
    branches: [main]
    paths: ['_drafts/cam-nang/**', 'cam-nang/**', '.github/workflows/factory-publish.yml']
  workflow_dispatch:
    inputs:
      publish_ids:
        description: "explicit PASS ids to publish (comma-separated), e.g. XM-0100,CD-0100"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: factory-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore QA evidence cache (content-hash keyed reuse)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: qa-evidence
          path: reports/article-quality

      - name: Select push scope (exact IDs derived from added/modified article files)
        if: github.event_name == 'push'
        id: select
        run: |
          set -e
          # Article files ADDED and MODIFIED by this push (drafts under
          # _drafts/cam-nang/ AND published files under cam-nang/).
          # PUBLISHED-row modifications are IGNORED by the selector.
          git diff --name-only --diff-filter=A HEAD~1 HEAD -- _drafts/cam-nang/ cam-nang/ > /tmp/added.txt || true
          git diff --name-only --diff-filter=M HEAD~1 HEAD -- _drafts/cam-nang/ cam-nang/ > /tmp/modified.txt || true
          echo "added article files: $(wc -l < /tmp/added.txt || echo 0), modified: $(wc -l < /tmp/modified.txt || echo 0)"
          python3 scripts/factory_push_selection.py --added /tmp/added.txt --modified /tmp/modified.txt | tee /tmp/selection.json
          python3 - <<'EOF'
          import json, os
          sel = json.load(open('/tmp/selection.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"proceed={str(sel['proceed']).lower()}\n")
              f.write(f"mode={sel['mode']}\n")
              f.write(f"batch={sel['batch'] or ''}\n")
              f.write(f"claim_ids={','.join(sel['claim_ids'])}\n")
              f.write(f"qa_ids={','.join(sel['qa_ids'])}\n")
              f.write(f"publish_ids={','.join(sel['publish_ids'])}\n")
              f.write(f"refuse={sel['refuse'] or ''}\n")
          print(f"selection: mode={sel['mode']} batch={sel['batch']} "
                f"claim={sel['claim_ids']} qa={sel['qa_ids']} "
                f"publish={sel['publish_ids']}")
          if sel.get('published_edits'):
              print(f"ignored PUBLISHED-row edits: {sel['published_edits']}")
          if sel.get('unmapped_paths'):
              print(f"audit: unmapped article paths: {sel['unmapped_paths']}")
          if sel['refuse']:
              raise SystemExit(f"REFUSED: {sel['refuse']}")
          EOF

      - name: Resolve dispatch publish scope (explicit PASS ids only)
        if: github.event_name == 'workflow_dispatch'
        id: dispatch
        run: |
          set -e
          IDS="$(printf '%s' "${{ github.event.inputs.publish_ids }}" | tr -cd 'A-Z0-9,-')"
          if [ -z "$IDS" ]; then
            echo "REFUSED: workflow_dispatch requires explicit publish_ids (comma-separated PASS article ids)"
            exit 3
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "mode=dispatch-publish" >> "$GITHUB_OUTPUT"
          echo "batch=" >> "$GITHUB_OUTPUT"
          echo "claim_ids=" >> "$GITHUB_OUTPUT"
          echo "qa_ids=" >> "$GITHUB_OUTPUT"
          echo "publish_ids=$IDS" >> "$GITHUB_OUTPUT"

      - name: Guard (no pending transaction, no batch lock)
        if: (steps.select.outputs.proceed == 'true' || steps.dispatch.outputs.proceed == 'true')
        run: |
          set -e
          # Fail-closed: a pending transaction marker means an earlier
          # multi-file mutation was interrupted; recover FIRST.
          node scripts/js/factory.mjs --recover
          test ! -f data/batches/txn/txn.json || { echo "pending txn marker still present after --recover"; exit 1; }
          for l in data/batches/*.lock; do
            test -z "$l" && continue
            case "$l" in
              *\**) ;;  # glob did not expand: no locks
              *) echo "stale batch lock present: $l"; exit 1 ;;
            esac
          done

      - name: Pre-op invariants (matrix + factory consistency, never bypassed)
        if: (steps.select.outputs.proceed == 'true' || steps.dispatch.outputs.proceed == 'true')
        run: |
          set -e
          python3 scripts/validate_content_matrix.py
          node scripts/js/factory.mjs --consistency

      - name: Claim exactly the added-article IDs (never a blind claim)
        if: steps.select.outputs.proceed == 'true' && steps.select.outputs.claim_ids != ''
        run: |
          set -e
          python3 scripts/run_article_batch.py --batch "${{ steps.select.outputs.batch }}" --claim-ids --ids "${{ steps.select.outputs.claim_ids }}"

      - name: Scoped QA (3 gate tools on the exact push IDs; exit contract 0/3/4)
        # Runs ONCE. Per-article isolation: FAIL/REVIEW/BLOCKED rows are
        # legitimate recorded state (exit 3/4) and never block this
        # pair's PASS rows; tool/config (1), usage/lock (2) and unknown
        # exits abort the run RED. The exit code is captured from
        # PIPESTATUS so the report still streams through tee.
        if: steps.select.outputs.proceed == 'true' && steps.select.outputs.qa_ids != ''
        id: qa
        run: |
          set +e
          python3 scripts/run_article_batch.py --batch "${{ steps.select.outputs.batch }}" --ids "${{ steps.select.outputs.qa_ids }}" --qa | tee /tmp/qa-output.txt
          code=${PIPESTATUS[0]}
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "qa exit code: 0 (clean)" ;;
            3) echo "qa exit code: 3 (FAIL article rows legitimately recorded)" ;;
            4) echo "qa exit code: 4 (REVIEW/BLOCKED rows legitimately recorded)" ;;
            *) echo "::error::qa failed with exit $code (tool/config=1, usage/lock=2; ONLY 0/3/4 are valid results)"; exit "$code" ;;
          esac

      - name: Compute publish scope (explicit PASS ids only)
        if: (steps.select.outputs.proceed == 'true' || steps.dispatch.outputs.proceed == 'true')
        id: passids
        run: |
          set -e
          python3 - <<'EOF' > /tmp/pass_ids.txt
          import csv, os
          preselected = os.environ.get('PRESELECTED_IDS', '')
          qa_ids = os.environ.get('QA_IDS', '')
          ids = set(x for x in preselected.split(',') if x)
          # QA'd ids that REACHED PASS in the matrix (this run's QA truth)
          if qa_ids:
              wanted = set(x for x in qa_ids.split(',') if x)
              with open('data/content-matrix.csv', encoding='utf-8') as f:
                  for r in csv.DictReader(f):
                      aid = (r.get('article_id') or '').strip()
                      if aid in wanted and (r.get('status') or '').strip() == 'PASS':
                          ids.add(aid)
          print(','.join(sorted(ids)))
          EOF
          PASS_IDS="$(cat /tmp/pass_ids.txt)"
          echo "publish scope: '$PASS_IDS'"
          echo "ids=$PASS_IDS" >> "$GITHUB_OUTPUT"
        env:
          PRESELECTED_IDS: ${{ steps.select.outputs.publish_ids || steps.dispatch.outputs.publish_ids }}
          QA_IDS: ${{ steps.select.outputs.qa_ids }}

      - name: Grouped transactional publish (explicit PASS ids, fail-closed)
        if: steps.passids.outputs.ids != ''
        id: publish
        run: |
          set -e
          node scripts/js/factory.mjs --publish "${{ steps.passids.outputs.ids }}" --dry-run
          node scripts/js/factory.mjs --publish "${{ steps.passids.outputs.ids }}"
          node scripts/js/factory.mjs --consistency

      - name: Apply the shared article shell to the files promoted by THIS transaction
        if: steps.passids.outputs.ids != ''
        run: |
          set -e
          python3 - "${{ steps.passids.outputs.ids }}" <<'PY' > promoted_files.txt
          import csv, os, sys
          ids = {s.strip() for s in sys.argv[1].split(',') if s.strip()}
          with open('data/content-matrix.csv', encoding='utf-8') as f:
              for row in csv.DictReader(f):
                  if row.get('article_id') in ids and row.get('status') == 'PUBLISHED':
                      p = row.get('output_path') or ''
                      if p and os.path.isfile(p):
                          print(p)
          PY
          if [ -s promoted_files.txt ]; then
            xargs -r python3 scripts/apply_article_shell.py < promoted_files.txt
          fi

      - name: PUBLISH GATE (freshly published articles always fully re-validated)
        if: steps.passids.outputs.ids != ''
        run: python3 scripts/gate_published_articles.py --ids "${{ steps.passids.outputs.ids }}"

      - name: Batch-end FULL audit (when this publish completes the batch)
        if: steps.passids.outputs.ids != ''
        run: |
          set -e
          python3 - "${{ steps.select.outputs.batch || '' }}" <<'PY' > batch_state.txt
          import csv, sys
          batch = (sys.argv[1] or '').strip()
          terminal = {"PUBLISHED", "FAIL", "BLOCKED"}
          if not batch:
              print("BATCH-UNKNOWN"); raise SystemExit
          with open('data/content-matrix.csv', encoding='utf-8') as f:
              rows = [r for r in csv.DictReader(f)
                      if (r.get('batch_id') or '').strip() == batch
                      and not (r.get('article_id') or '').startswith('SAMPLE')]
          done = all((r.get('status') or '').strip() in terminal for r in rows) if rows else False
          print("BATCH-COMPLETE %s" % batch if done else "BATCH-ACTIVE %s" % batch)
          PY
          cat batch_state.txt || echo "BATCH-UNKNOWN (dispatch publish without a resolved batch)"
          if grep -q "^BATCH-COMPLETE" batch_state.txt; then
            echo "Running batch-end FULL audit of all published articles"
            python3 scripts/gate_published_articles.py
          fi

      - name: Canonical generator freshness (python vs node byte-equality)
        if: steps.passids.outputs.ids != ''
        run: |
          set -e
          python3 scripts/generate_category_pages.py
          python3 scripts/generate_sitemap.py --check
          python3 scripts/generate_category_pages.py --check

      - name: Light matrix smoke + semantic verifier (scoped pre-push gate)
        if: (steps.select.outputs.proceed == 'true' || steps.dispatch.outputs.proceed == 'true')
        run: |
          set -e
          python3 scripts/validate_content_matrix.py
          node scripts/js/factory.mjs --consistency
          if [ -n "${{ steps.passids.outputs.ids }}" ]; then
            python3 scripts/verify_factory_state.py --op publish --ids "${{ steps.passids.outputs.ids }}"
          fi
          python3 scripts/verify_factory_state.py --op consistency

      - name: Commit derived state (single commit per run)
        if: (steps.select.outputs.proceed == 'true' || steps.dispatch.outputs.proceed == 'true')
        run: |
          set -e
          git config user.name "shop-factory-bot"
          git config user.email "nguyentuantu2482@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no state changes to commit"
          else
            git commit -m "factory: ${{ steps.select.outputs.mode || steps.dispatch.outputs.mode }} publish (${{ steps.passids.outputs.ids }}) [automated txn]"
            # Push with bounded rebase retry: the writer may push drafts
            # while this run is committing. Writer pushes never touch the
            # factory ledger, so the rebase cannot conflict on derived
            # state; consistency is re-verified on the rebased tree
            # BEFORE pushing it (tree A is never pushed).
            ok=0
            for attempt in 1 2; do
              if git push; then ok=1; break; fi
              echo "push attempt $attempt failed; rebase and re-verify"
              git pull --rebase origin main
              node scripts/js/factory.mjs --consistency
              python3 scripts/validate_content_matrix.py
            done
            if [ "$ok" != "1" ]; then
              echo "::error::push failed after 2 attempts (rebase + re-verify)"
              exit 1
            fi
          fi

      - name: Assert clean factory state (fail-closed postcondition)
        if: (steps.select.outputs.proceed == 'true' || steps.dispatch.outputs.proceed == 'true')
        run: |
          set -e
          test ! -f data/batches/txn/txn.json || { echo "txn marker left behind"; exit 1; }
          for l in data/batches/*.lock; do
            test -z "$l" && continue
            case "$l" in
              *\**) ;;
              *) echo "batch lock left behind: $l"; exit 1 ;;
            esac
          done
          if [ -n "${{ steps.passids.outputs.ids }}" ]; then
            echo "PUBLISHED this run: ${{ steps.passids.outputs.ids }}"
          else
            echo "no PASS rows this run; QA state committed for repair/review"
          fi

      - name: Save QA evidence cache
        if: always() && (steps.select.outputs.proceed == 'true' || steps.dispatch.outputs.proceed == 'true')
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence
          path: reports/article-quality/qa-evidence.json
          if-no-files-found: ignore
