name: Performance Batch 1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/performance-batch1.yml'
      - '.github/scripts/perf_batch1.py'

permissions:
  contents: write

jobs:
  performance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply performance optimizations
        shell: bash
        run: python3 .github/scripts/perf_batch1.py

      - name: Validate production diff
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          CHANGED="$(git diff --name-only)"

          echo "Changed files:"
          printf '%s\n' "$CHANGED"

          if [ -z "$CHANGED" ]; then
            echo "FAIL: NO PRODUCTION CHANGES"
            exit 1
          fi

          UNEXPECTED="$(
            printf '%s\n' "$CHANGED" |
            grep -vE '^[^/]+\.html$' || true
          )"

          if [ -n "$UNEXPECTED" ]; then
            echo "FAIL: Unexpected files changed"
            printf '%s\n' "$UNEXPECTED"
            exit 1
          fi

          git diff --stat

      - name: Commit production changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- *.html

          STAGED="$(git diff --cached --name-only)"

          BAD="$(
            printf '%s\n' "$STAGED" |
            grep -vE '^[^/]+\.html$' || true
          )"

          if [ -z "$STAGED" ]; then
            echo "FAIL: nothing staged"
            exit 1
          fi

          if [ -n "$BAD" ]; then
            echo "FAIL: unexpected staged files"
            printf '%s\n' "$BAD"
            exit 1
          fi

          git commit -m "perf: optimize static image delivery and initialization"

          git push origin HEAD:main
