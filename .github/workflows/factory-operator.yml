name: Factory Operator Tooling

# WHY THIS EXISTS: the external operator runtime (the Mistral agent) has no
# local Node/Python/git and no direct network access, so it cannot run
# scripts/js/factory.mjs on its own machine. This workflow is the operator's
# HANDS ONLY: it reads one whitelisted, deterministic command from
# data/batches/operator-command.json (pushed by the operator) and executes
# ONLY canonical repository tooling. It never writes editorial article
# content, never invents facts, contains no AI, no cron, no secrets beyond
# the default GITHUB_TOKEN, and pushes only the deterministic outputs of
# the canonical scripts (matrix ledger state, category hubs, sitemap.xml,
# batch reports, exported per-row writer manifests under
# reports/batches/<batch>/rows/ and â for the apply-article-shell op â the
# presentation-structure shell produced by scripts/apply_article_shell.py,
# which is forbidden from touching prose, links, canonicals or dates).
# The operator (AI or human) remains the sole writer of article bodies.

on:
  push:
    branches: [main]
    paths: ['data/batches/operator-command.json']

concurrency:
  group: article-batch-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  operate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Read and validate operator command
        run: |
          set -eu
          CMD=data/batches/operator-command.json
          OP="$(jq -r '.op // ""' "$CMD"),(Í=@¥¸(ÁÉÁÉµ¹áÑñÅñÁÕ±¥Í¡ñ½¹Í¥ÍÑ¹åñÉ½ÙÉñÉÅÕÕñÕ¹¥ÑÑÍÑñÁÁ±äµÉÑ¥±µÍ¡±°¤ìì(¨¤¡¼èéÉÉ½ÈèéÕ¹ÍÕÁÁ½ÉÑ½Àè=@ìá¥ÐÄìì(Í(¡¼½Àô=@øø%Q!U	}9X(	Q ô¡©ÄµÈ¹Ñ ¼¼5ðÑÈµµhÀ´ä´¤(%Lô¡©ÄµÈ¹¥Ì¼¼5ðÑÈµµhÀ´ä°´¤(Qô¡©ÄµÈ¹Ñ¼¼5ðÑÈµÀ´ä´¤(¡¼Ñ ô	Q øø%Q!U	}9X(¡¼¥Ìô%Løø%Q!U	}9X(¡¼ÑôQøø%Q!U	}9X((´¹µè5ÑÉ¥à¥¹ÙÉ¥¹Ð¡¹ÙÈåÁÍÍ¤(ÉÕ¸èÁåÑ¡½¸ÌÍÉ¥ÁÑÌ½Ù±¥Ñ}½¹Ñ¹Ñ}µÑÉ¥à¹Áä((´¹µèI½ÙÈ¹äÁ¹¥¹ÑÉ¹ÍÑ¥½¸½ÉµÕÑÑ¥½¹Ì(ÉÕ¸è¹½ÍÉ¥ÁÑÌ½©Ì½Ñ½Éä¹µ©Ì´µÉ½ÙÈ((´¹µè9½½¹Í¥ÍÑ¹ä¡¬¡ÁÉµ½À¤(ÉÕ¸è¹½ÍÉ¥ÁÑÌ½©Ì½Ñ½Éä¹µ©Ì´µ½¹Í¥ÍÑ¹ä((´¹µèÁÉÁÉµ¹áÐ´±¥´¹áÐÑ °áÁ½ÉÐÁÈµÉ½ÜÝÉ¥ÑÈµ¹¥ÍÑÌ(¥è¹Ø¹½ÀôôÁÉÁÉµ¹áÐ(ÉÕ¸èð(ÍÐµÔ(ÁåÑ¡½¸ÌÍÉ¥ÁÑÌ½ÉÕ¹}ÉÑ¥±}Ñ ¹Áä´µ¹áÐ´µÁÉÁÉµ¹Ð(ÁåÑ¡½¸ÌÍÉ¥ÁÑÌ½áÁ½ÉÑ}Ñ¡}É½ÝÌ¹Áä((´¹µèÉÅÕÕ´%0´øIA%HÑÈ½ÁÉÑ½ÈÉÁ¥È¡ÕÐ¹½É¤(¥è¹Ø¹½ÀôôÉÅÕÕ(ÉÕ¸èð(ÍÐµÔ(¥lµè¥ÌtìÑ¡¸¡¼èéÉÉ½ÈèéÉÅÕÕÉÅÕ¥ÉÌ¥Ììá¥ÐÄì¤(ÁåÑ¡½¸ÌÍÉ¥ÁÑÌ½ÉÅÕÕ}É½ÝÌ¹Áä´µ¥Ì¥Ì(´¹µèÅ´ÑÉµ¥¹¥ÍÑ¥E½Ñ¡Ñ¥ÙÑ (¥è¹Ø¹½ÀôôÅ(ÉÕ¸èð(½ôÀ(ÁåÑ¡½¸ÌÍÉ¥ÁÑÌ½ÉÕ¹}ÉÑ¥±}Ñ ¹Áä´µÑ Ñ ´µÅñð½ôü(¡¼Åá¥Ð½è½ Ìõ%0É½ÝÌ°ÐõIY%\½	1=-É½ÝÌÉÉ½É°¹½ÐÑ°¤((´¹µèÁÕ±¥Í ´±¥ÀAMLÉ½ÝÌÑ¼AU	1%M!°É¸¡ÕÌ½Í¥ÑµÀ½ÉÁ½ÉÑÌ(¥è¹Ø¹½ÀôôÁÕ±¥Í (ÉÕ¸èð(ÍÐµÔ(¥lµè¥ÌtìÑ¡¸¡¼èéÉÉ½ÈèéÁÕ±¥Í ÉÅÕ¥ÉÌ¥Ììá¥Ð