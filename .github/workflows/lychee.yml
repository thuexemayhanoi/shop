name: Lychee link check (readonly)

# Independent link checker. Read-only. Never edits articles because one
# external site timed out; transient external failures are retried with a
# limited failure budget (.github/lychee.toml).
# The site is plain static HTML: the deployable tree is copied to dist/shop
# and scanned with --root-dir so root-absolute internal links resolve
# exactly like on GitHub Pages. Internal routes are ALSO covered by the
# SEO engine (scripts/seo/seo_audit.py) in the PR verifier.

on:
  pull_request:
    paths:
      - '**.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - '.github/lychee.toml'
      - '.github/workflows/lychee.yml'
  schedule:
    - cron: "0 20 * * 1"  # weekly, off-peak UTC, read-only
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lychee-readonly
  cancel-in-progress: false

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble deployable tree (Pages-equivalent)
        run: |
          set -euo pipefail
          mkdir -p dist/shop
          rsync -a \
            --exclude '.github' --exclude '.git*' \
            --exclude 'AGENTS.md' --exclude 'README.md' --exclude 'ARCHITECTURE.md' \
            --exclude 'config/' --exclude 'data/' --exclude 'docs/' \
            --exclude 'reports/' --exclude 'scripts/' --exclude 'tests/' \
            --exclude '_data/' --exclude '_includes/' --exclude '_snippets/' \
            --exclude 'motoai_v3*.js' --exclude 'motoai_v4*.js' \
            ./ dist/shop/
          echo "pages: $(find dist/shop -name '*.html' | wc -l)"

      - name: Run Lychee (local files, absolute links resolved via root-dir)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config .github/lychee.toml
            --root-dir "${{ github.workspace }}/dist"
            --verbose --no-progress
            './dist/shop/**/*.html'
          lycheeVersion: v0.18.1
          fail: true
          format: json
          output: lychee-report.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Emit lychee failures as annotations (diagnosable via API)
        if: failure()
        run: |
          set -u
          python3 - <<'PY2'
          import json
          try:
              data = json.load(open('lychee-report.json'))
          except Exception as e:
              print(f"::error::cannot read lychee-report.json: {e}")
              raise SystemExit
          fails = [r for r in data if r.get('status') not in ('ok', 'excluded', 'unknown')]
          print(f"::error::lychee failing links: {len(fails)}")
          for r in fails[:60]:
              print(f"::error::[{r.get('status')}] {r.get('url','')[:120]} <- {r.get('source','')[:80]} :: {str(r.get('error',''))[:120]}")
          PY2
