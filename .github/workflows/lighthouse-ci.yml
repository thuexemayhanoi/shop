name: Lighthouse CI (lab)

# Representative-page lab performance check. Lab scores only — NOT field
# Core Web Vitals. Blocks on regression with tolerance to avoid failing the
# repo for tiny score noise. Never modifies article prose.
# The public site is plain static HTML: the deployable tree is a filtered
# copy of the repo (same excludes as _config.yml), served from /shop, so
# root-absolute internal links resolve exactly like on Pages.

on:
  pull_request:
    paths:
      - '**.html'
      - 'assets/**'
      - '_includes/**'
      - '_snippets/**'
      - '_config.yml'
      - '.github/workflows/lighthouse-ci.yml'
      - '.github/lighthouserc.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-readonly
  cancel-in-progress: false

jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble deployable tree (Pages-equivalent, no build needed)
        run: |
          set -euo pipefail
          mkdir -p dist/shop
          rsync -a \
            --exclude '.github' --exclude '.git*' \
            --exclude 'AGENTS.md' --exclude 'README.md' --exclude 'ARCHITECTURE.md' \
            --exclude 'config/' --exclude 'data/' --exclude 'docs/' \
            --exclude 'reports/' --exclude 'scripts/' --exclude 'tests/' \
            --exclude '_data/' --exclude '_includes/' --exclude '_snippets/' \
            --exclude 'motoai_v3*.js' --exclude 'motoai_v4*.js' \
            ./ dist/shop/
          echo "pages:"; ls dist/shop | head -20

      - name: Prepare LHCI config (absolute dist path)
        run: sed "s#\"\.\./dist\"#\"$PWD/dist\"" .github/lighthouserc.json > ./lighthouserc.generated.json

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.generated.json
          uploadArtifacts: false
          temporaryPublicStorage: false
