name: diag BATCH-008 chunk3 gate output

# One-shot READ-ONLY diagnosis v2 (same precedent). Isolated copy only.

on:
  push:
    branches: [diag-b008-chunk3]

permissions:
  contents: write

concurrency:
  group: diag-b008-chunk3
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Publish in isolated copy, capture full gate output
        run: |
          set +e
          cp -r "$GITHUB_WORKSPACE" /tmp/shopdiag
          cd /tmp/shopdiag
          IDS="KN-0061,AT-0061,XM-0061,DL-0061,CD-0061,HD-0061"
          node scripts/js/factory.mjs --recover > /dev/null 2>&1
          node scripts/js/factory.mjs --publish "$IDS" --date 2026-09-28 > diag-publish.txt 2>&1
          python3 scripts/apply_article_shell.py >> diag-publish.txt 2>&1
          python3 scripts/gate_published_articles.py > diag-gate.txt 2>&1
          echo "GATE_EXIT=$?" >> diag-gate.txt
          mkdir -p "$GITHUB_WORKSPACE/diag"
          cp diag-publish.txt diag-gate.txt "$GITHUB_WORKSPACE/diag/"
      - name: Commit diag evidence to this branch only
        run: |
          git config user.name "factory-operator-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag/
          git commit -m "diag v2: full gate_published_articles.py output (isolated copy; MAIN untouched)"
          git push
