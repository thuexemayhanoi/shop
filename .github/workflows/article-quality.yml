name: Article Quality Gate

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cam-nang/**"
      - "data/content-matrix.csv"
      - "tests/**"
      - "scripts/**"
      - "config/article-rubric.json"
      - "config/business-facts.json"
      - "config/seo-ownership.json"
      - "config/source-policy.json"
      - "docs/**"
      - ".github/workflows/article-quality.yml"

permissions:
  contents: read

jobs:
  article-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run unit tests
        run: python3 -m unittest discover tests

      - name: Validate content matrix
        run: python3 scripts/validate_content_matrix.py

      - name: Determine candidate articles (REAL repository paths)
        id: candidates
        run: |
          set -eu
          # Production articles are validated at their REAL repository paths
          # (cam-nang/... etc.). Files are NEVER copied/flattened into /tmp:
          # flattening loses the directory, which breaks relative
          # article-to-article links inside a category directory.
          python3 - <<'PY' > candidates.txt
          import csv, os
          with open('data/content-matrix.csv', encoding='utf-8') as f:
              for row in csv.DictReader(f):
                  p = (row.get('output_path') or '').strip()
                  aid = row.get('article_id') or ''
                  if p.startswith('tests/') or aid.startswith('SAMPLE'):
                      continue  # fixtures and samples are not production articles
                  if p and os.path.isfile(p):
                      print(p)
          PY
          count=$(wc -l < candidates.txt)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Candidate production articles: $count (validated at real paths)"

      - name: Validate, cannibalization-check and score articles
        if: steps.candidates.outputs.count != '0'
        run: |
          set -eu
          status=0
          mkdir -p reports/article-quality
          while IFS= read -r f; do
            echo "===== $f"
            python3 scripts/validate_article.py "$f" || status=3
            # check_cannibalization exit contract: 0 = clean, 2 = REVIEW
            # (fuzzy title-similarity warnings — "never auto-fails" per the
            # checker's documented contract and the QA pipeline, which
            # already penalizes them in the score), 3 = conflict, 4 = error.
            # Only hard conflicts (3) and errors (4) fail the gate; exit 2
            # warnings stay visible in the log and in the article score.
            rc=0
            python3 scripts/check_cannibalization.py "$f" || rc=$?
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then status=3; fi
            python3 scripts/score_article.py "$f" || status=3
          done < candidates.txt
          exit $status

      - name: No candidates note
        if: steps.candidates.outputs.count == '0'
        run: echo "No production candidate articles to check (none published yet)."

      - name: Upload quality reports
        if: always() && steps.candidates.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: article-quality-reports
          path: reports/article-quality/
          if-no-files-found: ignore
