name: Repair Operator Workflow

# One-shot repair: restores the canonical factory-operator.yml from git
# history (commit 7253a3cd) byte-for-byte via the GitHub Contents API
# (race-safe against concurrent pushes), then deletes itself.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-operator.yml']

permissions:
  contents: write

concurrency:
  group: repair-operator-workflow
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore canonical factory-operator.yml via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          REPO=thuexemayhanoi/shop
          P=.github/workflows/factory-operator.yml
          BLOB=$(git rev-parse 7253a3cd75fbdc075c3d56b6e38236c93836623e:$P)
          B64=$(git cat-file blob "$BLOB" | base64 -w0)
          echo "blob sha: $BLOB, b64 length: $(printf %s "$B64" | wc -c)"
          for i in 1 2 3 4 5; do
            CUR=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/contents/$P?ref=main" | jq -r .sha)
            echo "attempt $i, current file sha: $CUR"
            PAYLOAD=$(jq -n --arg b "$B64" --arg s "$CUR" '{message:"ci: restore canonical factory-operator.yml from 7253a3cd (one-shot repair)", content:$b, sha:$s}')
            CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X PUT               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               --data "$PAYLOAD"               "https://api.github.com/repos/$REPO/contents/$P")
            echo "PUT status: $CODE"
            if [ "$CODE" = "200" ] || [ "$CODE" = "201" ]; then
              echo restored
              break
            fi
            cat /tmp/resp.json || true
            sleep 5
          done

      - name: Remove this repair workflow via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          REPO=thuexemayhanoi/shop
          P=.github/workflows/repair-operator.yml
          for i in 1 2 3 4 5; do
            RS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/contents/$P?ref=main" | jq -r .sha)
            PAYLOAD=$(jq -n --arg s "$RS" '{message:"ci: remove one-shot repair workflow", sha:$s}')
            CODE=$(curl -s -o /tmp/resp2.json -w "%{http_code}" -X DELETE               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               --data "$PAYLOAD"               "https://api.github.com/repos/$REPO/contents/$P")
            echo "DELETE status: $CODE"
            if [ "$CODE" = "200" ]; then
              break
            fi
            sleep 5
          done
