# Lychee configuration — independent link checker.
# Read-only: it never modifies files. Transient external failures are
# handled by retries + a generous timeout; a small external failure budget
# is accepted to avoid blocking on third-party downtime.

# -------------------------
# Parsing
# -------------------------
timeout = 30
retry_wait_time = 15
max_retries = 3

# -------------------------
# Exclusions — operational files are not public pages
# -------------------------
exclude = [
  # operational trees never deployed to Pages
  '^tests/',
  '^docs/',
  '^reports/',
  '^scripts/',
  '^config/',
  '^data/',
  '^\.github/',
  '^_data/',
  '^_includes/',
  '^_snippets/',
  '^AGENTS\.md',
  '^README\.md',
  '^ARCHITECTURE\.md',
  # expected: mail/phone
  '^mailto:',
  '^tel:',
  # expected redirects (github.io base)
  '^https://github\.com/thuexemayhanoi/shop$',
  # Vietnamese government/legal citation sites referenced by articles:
  # they block or rate-limit automated HEAD/GET requests. Approved ignore
  # list — the articles keep the links; we do not fail CI on their bot
  # filtering. Transient external failures get retries + cache instead.
  '^https://ttpvhcc\.hanoi\.gov\.vn/',
  '^https://mt\.gov\.vn/',
  '^https://badinh\.hanoi\.gov\.vn/',
  # external social/embeds frequently rate-limit crawlers — kept in ignore
  '^https://www\.facebook\.com/',
  '^https://zalo\.me/',
  '^https://wa\.me/',
  '^https://m\.me/',
  '^https://t\.me/',
  # external social/portfolio profiles of the shop that block automated
  # crawlers with 401/403/406/999 — links are valid, bots are filtered
  '^https://medium\.com/',
  '^https://www\.reddit\.com/',
  '^https://www\.producthunt\.com/',
  '^https://www\.pexels\.com/',
  '^https://www\.patreon\.com/',
  '^https://www\.kickstarter\.com/',
  '^https://vsco\.co/',
  '^https://www\.last\.fm/',
  '^https://letterboxd\.com/',
  '^https://unsplash\.com/',
  '^https://www\.linkedin\.com/',
  '^https://linkedin\.com/',
]


# -------------------------
# Behavior
# -------------------------
method = "get"
accept = ["200", "204", "301", "302", "429"]
max_concurrency = 8
cache = true
max_cache_age = "1d"
max_response_time = 20
